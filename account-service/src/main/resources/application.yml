server:
  port: 8081

spring:
  application:
    name: account-service   # 📍 isi naam se Eureka mein register hoga, aur Config Server isi naam ki config dhoondega
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5432/account_db
    username: bankuser
    password: bankpass
  jpa:
    hibernate:
      ddl-auto: update  # demo ke liye — production mein "validate" + Flyway/Liquibase
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# 📍 "Config Server" notebook ka concept — ye values Config Server se override
# ho sakti hain agar wahan account-service.yml mein defined ho.
banking:
  account:
    min-opening-balance: 500
    max-accounts-per-customer: 5

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
