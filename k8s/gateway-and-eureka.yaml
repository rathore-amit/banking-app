# 📍 Concept: "API Gateway" + "Service Discovery" notebooks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: banking/api-gateway:latest
          ports: [{ containerPort: 8080 }]
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-service:8761/eureka/
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer   # 📍 Cluster ke bahar se access ke liye external Load Balancer
  selector: { app: api-gateway }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
spec:
  replicas: 1   # single instance demo ke liye; production mein cluster mein chalate
  selector:
    matchLabels: { app: eureka-server }
  template:
    metadata:
      labels: { app: eureka-server }
    spec:
      containers:
        - name: eureka-server
          image: banking/eureka-server:latest
          ports: [{ containerPort: 8761 }]
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-service
spec:
  selector: { app: eureka-server }
  ports:
    - port: 8761
      targetPort: 8761
