# 📍 Concept: "Container Orchestration & Deployment" + "Kubernetes + CI/CD" notebooks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 2   # 📍 multiple replicas — Load Balancer notebook, "Service" object load balances traffic
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: banking/account-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/account_db
            - name: SPRING_DATA_REDIS_HOST
              value: redis-service
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-service:8761/eureka/
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          # 📍 "Observability & Health Checks" notebook — Liveness vs Readiness
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
spec:
  selector:
    app: account-service
  ports:
    - port: 8081
      targetPort: 8081
---
# 📍 "Container Orchestration & Deployment" notebook — HPA, auto-scale on CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: account-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: account-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
