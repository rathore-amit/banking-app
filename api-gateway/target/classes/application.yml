server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true   # 📍 "Service Discovery" notebook — Eureka se automatically routes banti hain
      routes:
        - id: account-service
          uri: lb://ACCOUNT-SERVICE   # lb:// = client-side load balancing across all healthy instances
          predicates:
            - Path=/api/accounts/**
          filters:
            - name: RequestRateLimiter   # 📍 "Load Balancing & Rate Limiting" notebook
              args:
                redis-rate-limiter.replenishRate: 10   # 10 requests/sec average
                redis-rate-limiter.burstCapacity: 20    # thoda burst allow

        - id: transaction-service
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/transfers/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

  redis:
    host: localhost
    port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

banking:
  security:
    jwt-secret: "ThisIsADemoSecretKeyForBankingApp1234567890"  # 📍 production mein Vault/Secrets Manager se aana chahiye

management:
  endpoints:
    web:
      exposure:
        include: health, gateway
